<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>No internet connection</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }
    
    /* Background dots/stars effect */
    .bg-particles {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(0, 255, 204, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 85% 30%, rgba(0, 255, 204, 0.05) 0%, transparent 50%);
      z-index: 0;
      pointer-events: none;
    }

    /* Illustration container */
    .illustration-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin-bottom: 24px;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .cloud-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 20px rgba(0, 255, 204, 0.4));
    }

    h1 { 
      font-size: 28px; 
      font-weight: 700;
      margin-bottom: 16px; 
      z-index: 1;
      line-height: 1.2;
    }
    h1 span {
      color: #00FFCC;
    }
    
    p { 
      font-size: 15px; 
      color: #a0a0a0; 
      margin-bottom: 40px; 
      line-height: 1.5; 
      z-index: 1;
      max-width: 320px;
    }
    p strong {
      color: #00FFCC;
      font-weight: 600;
    }
    
    button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(90deg, #22E58C 0%, #00D2FF 100%);
      color: #000000;
      border: none;
      padding: 16px 32px;
      font-size: 16px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      z-index: 1;
      width: 100%;
      max-width: 300px;
      transition: opacity 0.2s, transform 0.1s;
      box-shadow: 0 4px 20px rgba(0, 255, 204, 0.3);
    }
    button:active { 
      transform: scale(0.96); 
    }
    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .spin {
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="bg-particles"></div>
  
  <div class="illustration-container">
    <svg class="cloud-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Glow effect definitions -->
      <defs>
        <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00D2FF" />
          <stop offset="100%" stop-color="#22E58C" />
        </linearGradient>
      </defs>
      
      <!-- Cloud Body -->
      <path d="M50 110 C 30 110, 20 90, 30 70 C 40 50, 60 50, 70 50 C 80 30, 110 20, 130 40 C 150 40, 170 50, 170 70 C 180 90, 170 110, 150 110 Z" 
            stroke="url(#cloudGrad)" stroke-width="6" fill="rgba(0,0,0,0.8)" />
            
      <!-- Sad Eyes -->
      <path d="M70 75 Q 80 65, 90 75" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" />
      <path d="M110 75 Q 120 65, 130 75" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" />
      <circle cx="80" cy="82" r="6" fill="#ffffff" />
      <circle cx="120" cy="82" r="6" fill="#ffffff" />
      <circle cx="82" cy="80" r="2" fill="#000000" />
      <circle cx="122" cy="80" r="2" fill="#000000" />
      
      <!-- Tears -->
      <path d="M75 95 L 70 100" stroke="#00FFCC" stroke-width="3" stroke-linecap="round" />
      <path d="M85 97 L 80 102" stroke="#00FFCC" stroke-width="3" stroke-linecap="round" />
      <path d="M115 97 L 120 102" stroke="#00FFCC" stroke-width="3" stroke-linecap="round" />
      <path d="M125 95 L 130 100" stroke="#00FFCC" stroke-width="3" stroke-linecap="round" />
      
      <!-- Sad Mouth -->
      <path d="M95 90 Q 100 85, 105 90" stroke="#00D2FF" stroke-width="4" stroke-linecap="round" fill="none" />
      
      <!-- Broken Link -->
      <path d="M60 150 C 50 160, 70 180, 80 170 L 95 155 C 105 145, 95 130, 85 140" 
            stroke="#00D2FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
            
      <path d="M140 150 C 150 160, 130 180, 120 170 L 105 155 C 95 145, 105 130, 115 140" 
            stroke="#22E58C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
            
      <!-- Breaking sparks -->
      <line x1="100" y1="125" x2="100" y2="135" stroke="#22E58C" stroke-width="3" stroke-linecap="round" />
      <line x1="90" y1="130" x2="85" y2="135" stroke="#00D2FF" stroke-width="3" stroke-linecap="round" />
      <line x1="110" y1="130" x2="115" y2="135" stroke="#22E58C" stroke-width="3" stroke-linecap="round" />
      <line x1="100" y1="175" x2="100" y2="165" stroke="#22E58C" stroke-width="3" stroke-linecap="round" />
      
      <!-- Background shadow below broken link -->
      <ellipse cx="100" cy="185" rx="30" ry="4" fill="rgba(255,255,255,0.1)" />
    </svg>
  </div>

  <h1>No internet <span>connection</span></h1>
  <p>Looks like <strong>SkillLinkr</strong> lost the link.<br/>Check your connection and try again.</p>
  
  <button id="retryBtn" onclick="handleRetry()">
    <svg id="retryIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path>
      <path d="M21 3v5h-5"></path>
    </svg>
    <span id="retryText">Try again</span>
  </button>

  <script>
    const btn = document.getElementById('retryBtn');
    const btnText = document.getElementById('retryText');
    const icon = document.getElementById('retryIcon');

    async function handleRetry() {
      // 1. Enter loading state
      btn.disabled = true;
      btnText.textContent = 'Checking connection...';
      icon.classList.add('spin');

      // 2. Perform a real network check
      const isOnline = await checkTrueNetwork();

      if (isOnline) {
        // 3. Network restored! Restore URL.
        restoreUrl();
      } else {
        // Still offline, reset button
        setTimeout(() => {
          btn.disabled = false;
          btnText.textContent = 'Try again';
          icon.classList.remove('spin');
        }, 800);
      }
    }

    async function checkTrueNetwork() {
      if (!navigator.onLine) return false;
      try {
        // Fetch a small known resource to prove real internet access
        // Avoid caching, timeout after 5s
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), 5000);
        
        const response = await fetch('https://www.skilllinkr.com/favicon.ico?_=' + new Date().getTime(), {
          method: 'HEAD',
          signal: controller.signal,
          cache: 'no-store'
        });
        clearTimeout(id);
        return response.ok || response.status === 200;
      } catch (e) {
        return false;
      }
    }

    function restoreUrl() {
      // In a Capacitor Webview on Android/iOS, error.html is loaded from localhost.
      // We must NEVER redirect to localhost for the main app.
      
      // Determine the target URL based on history or fallback to production URL
      // If we are in Capacitor, window.history.length > 1 means there was a previous route.
      // history.back() correctly unloads error.html and reloads the previous app URL.
      if (window.history && window.history.length > 1) {
        window.history.back();
        
        // Failsafe: if history.back() didn't navigate away within 1s (e.g. first launch failure),
        // force a direct load to the production URL.
        setTimeout(() => {
          window.location.replace('https://www.skilllinkr.com/');
        }, 1000);
      } else {
        // If there's no history (first launch), go to the app's root.
        window.location.replace('https://www.skilllinkr.com/');
      }
    }
  </script>
</body>
</html>
